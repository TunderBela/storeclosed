<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Closed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">
        <!-- Fejléc -->
        <header class="game-header">
            <h1>STORE CLOSED</h1>
            <p class="subtitle">Switch off all the lights before you leave.</p>
        </header>

        <!-- Játéktér -->
        <div id="board" class="game-board">
            <!-- Ide generálja majd a JS a 25 darab .cell elemet -->
        </div>

        <!-- Vezérlés (Reset gomb) -->
        <div class="controls">
            <button id="reset-btn" class="btn">RESET GAME</button>
        </div>

        <!-- Üzenetek helye a képernyő alján -->
        <footer class="message-area">
            <p id="game-message">Good luck! Find the pattern.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
